name: ci
permissions:
  contents: read
concurrency:
  group: ci
  cancel-in-progress: false
  queue: max
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve one fresh dependency snapshot
      run: 'python3 .github/check-first-party.py

        cargo update

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock >> resolver.txt'
    - uses: actions/upload-artifact@v7
      with:
        name: resolved-lock
        path: 'Cargo.lock

          resolver.txt'
        retention-days: 7
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: resolved-lock
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
    - run: node .github/check-advisory-exposure.mjs
    - run: cargo deny --locked check advisories licenses
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
    needs:
    - resolve
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - run: 'rustc --version

        cargo fmt --check || { cargo fmt; git diff > formatting.patch; exit 1; }'
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked
    - run: bash .ci/remote-sqld.sh
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting
        path: formatting.patch
    needs:
    - resolve
  coverage:
    needs:
    - resolve
    - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: 'rustc --version

        cargo llvm-cov --version'
    - name: Measure real native round trips and failure paths
      run: cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage
        --no-cfg-coverage-nightly --ignore-filename-regex '/tests/' --json --output-path
        coverage.json
    - name: Export independent source inventories from the same execution
      run: |
        cargo llvm-cov report --branch --ignore-filename-regex '/tests/' --lcov --output-path coverage.lcov
        cargo llvm-cov report --branch --ignore-filename-regex '/tests/' --text --output-path coverage.txt
    - name: Require complete source line and branch coverage
      run: |
        python3 .github/test-source-coverage.py
        python3 .github/check-source-coverage.py coverage.lcov coverage.json coverage.txt
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: 'coverage.json

          coverage.lcov

          coverage.txt

          Cargo.lock

          resolver.txt'
        retention-days: 7
'on':
  push:
    branches:
    - main
    - ci/**
  pull_request: null
  workflow_dispatch: null
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
