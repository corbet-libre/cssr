[package]
name = "cssr"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Issuer for zero-knowledge accounting: accepts a verified change and records it"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cssr.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
ed25519-dalek = "3.0"
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp.git", branch = "v01" }
p256 = { version = "0.13", features = ["ecdsa"] }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt.git", branch = "v01" }
tokio = { version = "1", features = ["rt", "time", "net"] }
url = "2"

[dev-dependencies]
tempfile = "3"
